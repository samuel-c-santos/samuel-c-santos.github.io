<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <pattern id="gridComp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ebe5d8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#fdfaf3"/>
  <rect width="800" height="520" fill="url(#gridComp)"/>

  <!-- Top Banner / Sticker -->
  <g transform="translate(40, 22)">
    <rect x="4" y="4" width="260" height="32" fill="#000000"/>
    <rect x="0" y="0" width="260" height="32" fill="#ffe600" stroke="#000000" stroke-width="2.5"/>
    <text x="130" y="21" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, monospace" font-size="11.5" font-weight="900" letter-spacing="1">BENCHMARK: O CONFRONTO</text>

    <text x="720" y="22" text-anchor="end" fill="#000000" font-family="monospace" font-size="13" font-weight="900">Ganho Real: até 10.000x</text>
  </g>

  <!-- Title -->
  <text x="40" y="82" fill="#000000" font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
    Sem Índice Espacial vs Com Índice Espacial
  </text>

  <!-- LEFT CARD: SEM ÍNDICE -->
  <g transform="translate(40, 102)">
    <!-- Shadow -->
    <rect x="6" y="6" width="345" height="318" fill="#000000"/>
    <!-- Box -->
    <rect x="0" y="0" width="345" height="318" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="345" height="38" fill="#ff4d4d"/>
    <line x1="0" y1="38" x2="345" y2="38" stroke="#000000" stroke-width="2.5"/>
    <text x="16" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900">SEM ÍNDICE (VARREDURA)</text>
    <text x="330" y="24" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="11.5" font-weight="900">O(N)</text>

    <!-- Content Items -->
    <g transform="translate(20, 56)" font-family="system-ui, -apple-system, sans-serif">
      <!-- Item 1 -->
      <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">MÉTODO DE CONSULTA</text>
      <text x="0" y="17" fill="#000000" font-size="12.5" font-weight="900">Varredura Sequencial Linear</text>
      <text x="0" y="31" fill="#555555" font-size="10">Lê linha após linha na ordem física do disco</text>

      <!-- Item 2 -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">LINHAS INSPECIONADAS</text>
        <text x="0" y="21" fill="#ff4d4d" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="18" font-weight="900">5.000.000 de feições</text>
        <text x="0" y="35" fill="#555555" font-size="10">Calcula vértices de feições no país inteiro</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 102)">
        <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">TEMPO MÉDIO DE RESPOSTA</text>
        <text x="0" y="25" fill="#ff4d4d" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="22" font-weight="900">18 minutos 🐢</text>
        <text x="0" y="41" fill="#b91c1c" font-size="10" font-weight="700">Ou travamento por Out Of Memory</text>
      </g>
    </g>

    <!-- Bottom Stamp -->
    <g transform="translate(20, 266)">
      <rect x="0" y="0" width="305" height="34" fill="#fee2e2" stroke="#000000" stroke-width="2"/>
      <text x="152" y="22" text-anchor="middle" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">🚨 INVIÁVEL PARA GRANDES BASES</text>
    </g>
  </g>

  <!-- RIGHT CARD: COM ÍNDICE -->
  <g transform="translate(415, 102)">
    <!-- Shadow -->
    <rect x="6" y="6" width="345" height="318" fill="#000000"/>
    <!-- Box -->
    <rect x="0" y="0" width="345" height="318" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="345" height="38" fill="#00f076"/>
    <line x1="0" y1="38" x2="345" y2="38" stroke="#000000" stroke-width="2.5"/>
    <text x="16" y="24" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900">COM ÍNDICE (R-TREE / GIST)</text>
    <text x="330" y="24" text-anchor="end" fill="#000000" font-family="monospace" font-size="11.5" font-weight="900">O(log N)</text>

    <!-- Content Items -->
    <g transform="translate(20, 56)" font-family="system-ui, -apple-system, sans-serif">
      <!-- Item 1 -->
      <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">MÉTODO DE CONSULTA</text>
      <text x="0" y="17" fill="#000000" font-size="12.5" font-weight="900">Poda Hierárquica por Bounding Box</text>
      <text x="0" y="31" fill="#555555" font-size="10">Descarta regiões inteiras comparando retângulos</text>

      <!-- Item 2 -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">TESTES EXATOS DE GEOMETRIA</text>
        <text x="0" y="21" fill="#000000" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="18" font-weight="900">2 ou 3 feições</text>
        <text x="0" y="35" fill="#555555" font-size="10">Apenas candidatos reais sofrem ST_Intersects</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 102)">
        <text x="0" y="0" fill="#666666" font-family="monospace" font-size="10" font-weight="700">TEMPO MÉDIO DE RESPOSTA</text>
        <text x="0" y="25" fill="#000000" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="22" font-weight="900">14 milissegundos ⚡</text>
        <text x="0" y="41" fill="#008a40" font-size="10" font-weight="700">Resposta instantânea sem tocar o disco</text>
      </g>
    </g>

    <!-- Bottom Stamp -->
    <g transform="translate(20, 266)">
      <rect x="0" y="0" width="305" height="34" fill="#dcfce7" stroke="#000000" stroke-width="2"/>
      <text x="152" y="22" text-anchor="middle" fill="#008a40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">✓ PADRÃO DE ENGENHARIA DE DADOS</text>
    </g>
  </g>

  <!-- Bottom Quote Bar (Multiline with clean padding) -->
  <g transform="translate(40, 438)">
    <rect x="4" y="4" width="720" height="62" fill="#000000"/>
    <rect x="0" y="0" width="720" height="62" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    
    <text x="20" y="26" fill="#000000" font-family="system-ui, -apple-system, monospace" font-size="12" font-weight="900">
      SQL: <tspan font-weight="600" fill="#008a40">CREATE INDEX idx_geom ON tabela USING GIST (geom);</tspan>
    </text>
    <text x="20" y="46" fill="#444444" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400">
      Importante: sempre execute <tspan font-family="monospace" font-weight="700" fill="#000000">ANALYZE tabela;</tspan> para que o planejador de consultas reconheça o índice.
    </text>
  </g>
</svg>