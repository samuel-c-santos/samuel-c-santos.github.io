<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <pattern id="gridRtree" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ebe5d8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#fdfaf3"/>
  <rect width="800" height="520" fill="url(#gridRtree)"/>

  <!-- Top Banner / Sticker -->
  <g transform="translate(40, 22)">
    <rect x="4" y="4" width="250" height="32" fill="#000000"/>
    <rect x="0" y="0" width="250" height="32" fill="#38bdf8" stroke="#000000" stroke-width="2.5"/>
    <text x="125" y="21" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, monospace" font-size="11.5" font-weight="900" letter-spacing="1">ESTRUTURA DE DADOS: R-TREE</text>

    <text x="720" y="22" text-anchor="end" fill="#000000" font-family="monospace" font-size="13" font-weight="900">PostGIS GiST • GeoPackage</text>
  </g>

  <!-- Title -->
  <text x="40" y="82" fill="#000000" font-family="system-ui, -apple-system, 'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
    Do Espaço Geográfico para a Árvore de Caixas
  </text>

  <!-- LEFT PANEL: Bounding Boxes no Mapa -->
  <g transform="translate(40, 102)">
    <!-- Shadow -->
    <rect x="6" y="6" width="345" height="318" fill="#000000"/>
    <!-- Box -->
    <rect x="0" y="0" width="345" height="318" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="345" height="36" fill="#000000"/>
    <text x="16" y="23" fill="#ffffff" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="900">1. NO MAPA (BOUNDING BOXES)</text>

    <!-- Map Area -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="315" height="215" fill="#f4efe6" stroke="#000000" stroke-width="2.5"/>

      <!-- Bloco A (Azul) -->
      <rect x="12" y="12" width="138" height="190" fill="#bae6fd" stroke="#000000" stroke-width="2.2" stroke-dasharray="4 3"/>
      <rect x="18" y="18" width="68" height="18" fill="#38bdf8" stroke="#000000" stroke-width="1.2"/>
      <text x="52" y="31" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9" font-weight="900">BLOCO A</text>

      <!-- BBox 1 dentro de A -->
      <rect x="22" y="44" width="118" height="68" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <polygon points="35,92 50,56 120,64 105,98" fill="#38bdf8" stroke="#000000" stroke-width="1.5"/>
      <text x="30" y="58" fill="#000000" font-family="monospace" font-size="8.5" font-weight="700">Caixa 1</text>

      <!-- BBox 2 dentro de A -->
      <rect x="22" y="120" width="118" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <polygon points="40,138 85,130 115,160 75,180" fill="#38bdf8" stroke="#000000" stroke-width="1.5"/>
      <text x="30" y="134" fill="#000000" font-family="monospace" font-size="8.5" font-weight="700">Caixa 2</text>

      <!-- Bloco B (Roxo/Lavanda) -->
      <rect x="162" y="12" width="140" height="190" fill="#e9d5ff" stroke="#000000" stroke-width="2.2" stroke-dasharray="4 3"/>
      <rect x="168" y="18" width="68" height="18" fill="#c084fc" stroke="#000000" stroke-width="1.2"/>
      <text x="202" y="31" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9" font-weight="900">BLOCO B</text>

      <!-- BBox 3 dentro de B -->
      <rect x="172" y="44" width="120" height="68" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <polygon points="185,88 205,55 270,68 250,100" fill="#c084fc" stroke="#000000" stroke-width="1.5"/>
      <text x="180" y="58" fill="#000000" font-family="monospace" font-size="8.5" font-weight="700">Caixa 3</text>

      <!-- BBox 4 dentro de B -->
      <rect x="172" y="120" width="120" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
      <polygon points="190,136 240,132 275,165 230,180" fill="#c084fc" stroke="#000000" stroke-width="1.5"/>
      <text x="180" y="134" fill="#000000" font-family="monospace" font-size="8.5" font-weight="700">Caixa 4</text>
    </g>

    <!-- Footer label -->
    <text x="172" y="295" text-anchor="middle" fill="#000000" font-family="monospace" font-size="10.5" font-weight="700">
      Cada caixa = 4 números: (minX, minY, maxX, maxY)
    </text>
  </g>

  <!-- RIGHT PANEL: A Hierarquia da Árvore -->
  <g transform="translate(415, 102)">
    <!-- Shadow -->
    <rect x="6" y="6" width="345" height="318" fill="#000000"/>
    <!-- Box -->
    <rect x="0" y="0" width="345" height="318" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>

    <!-- Header -->
    <rect x="0" y="0" width="345" height="36" fill="#000000"/>
    <text x="16" y="23" fill="#ffffff" font-family="system-ui, -apple-system, monospace" font-size="11" font-weight="900">2. NA ÁRVORE R-TREE</text>

    <!-- Tree Visual -->
    <g transform="translate(15, 48)">
      <!-- Connecting solid lines -->
      <g stroke="#000000" stroke-width="2.5" fill="none">
        <line x1="157" y1="36" x2="75" y2="76"/>
        <line x1="157" y1="36" x2="240" y2="76"/>
        <line x1="75" y1="108" x2="42" y2="142"/>
        <line x1="75" y1="108" x2="108" y2="142"/>
        <line x1="240" y1="108" x2="207" y2="142"/>
        <line x1="240" y1="108" x2="273" y2="142"/>
      </g>

      <!-- Nó Raiz -->
      <g transform="translate(107, 4)">
        <rect x="2" y="2" width="100" height="32" fill="#000000"/>
        <rect x="0" y="0" width="100" height="32" fill="#ffe600" stroke="#000000" stroke-width="2.2"/>
        <text x="50" y="21" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900">NÓ RAIZ</text>
      </g>

      <!-- Nó Nível 1: Bloco A -->
      <g transform="translate(25, 76)">
        <rect x="2" y="2" width="100" height="32" fill="#000000"/>
        <rect x="0" y="0" width="100" height="32" fill="#38bdf8" stroke="#000000" stroke-width="2.2"/>
        <text x="50" y="21" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">BLOCO A</text>
      </g>

      <!-- Nó Nível 1: Bloco B -->
      <g transform="translate(190, 76)">
        <rect x="2" y="2" width="100" height="32" fill="#000000"/>
        <rect x="0" y="0" width="100" height="32" fill="#c084fc" stroke="#000000" stroke-width="2.2"/>
        <text x="50" y="21" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900">BLOCO B</text>
      </g>

      <!-- Folhas / BBoxes -->
      <g transform="translate(12, 142)">
        <rect x="1" y="1" width="60" height="28" fill="#000000"/>
        <rect x="0" y="0" width="60" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="30" y="18" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9.5" font-weight="700">Caixa 1</text>
      </g>

      <g transform="translate(78, 142)">
        <rect x="1" y="1" width="60" height="28" fill="#000000"/>
        <rect x="0" y="0" width="60" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="30" y="18" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9.5" font-weight="700">Caixa 2</text>
      </g>

      <g transform="translate(177, 142)">
        <rect x="1" y="1" width="60" height="28" fill="#000000"/>
        <rect x="0" y="0" width="60" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="30" y="18" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9.5" font-weight="700">Caixa 3</text>
      </g>

      <g transform="translate(243, 142)">
        <rect x="1" y="1" width="60" height="28" fill="#000000"/>
        <rect x="0" y="0" width="60" height="28" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="30" y="18" text-anchor="middle" fill="#000000" font-family="monospace" font-size="9.5" font-weight="700">Caixa 4</text>
      </g>

      <!-- Pointers label -->
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="315" height="52" fill="#f4efe6" stroke="#000000" stroke-width="1.5"/>
        <text x="157" y="20" text-anchor="middle" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">As folhas apontam para os offsets no disco</text>
        <text x="157" y="38" text-anchor="middle" fill="#555555" font-family="monospace" font-size="9">O motor só vai ao disco se a caixa tocar o alvo!</text>
      </g>
    </g>
  </g>

  <!-- Bottom Quote Bar (Multiline with clean padding) -->
  <g transform="translate(40, 438)">
    <rect x="4" y="4" width="720" height="62" fill="#000000"/>
    <rect x="0" y="0" width="720" height="62" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    
    <text x="20" y="26" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800">
      A trapaça da R-Tree: <tspan font-weight="400">testar se dois retângulos se cruzam leva nanosegundos na CPU.</tspan>
    </text>
    <text x="20" y="46" fill="#444444" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">
      O motor só calcula trigonometria exata nas feições que tocarem a caixa envolvente.
    </text>
  </g>
</svg>